name: container

# The image is built from the crate on crates.io, so publish the crate first. A version tag (v0.4.1) builds that
# version; "Run workflow" rebuilds any published version, for example to pick up a new Alpine or pigz.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Published crate version to build, for example 0.4.1"
        required: true

concurrency:
  group: container-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"
      - name: Wait for the crate on crates.io, then choose the tags
        id: tags
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "degibbs-container-build" "https://crates.io/api/v1/crates/degibbs/${VERSION}")
            [ "$code" = 200 ] && break
            [ "$i" = 30 ] && { echo "degibbs ${VERSION} is not on crates.io: publish it first" >&2; exit 1; }
            sleep 30
          done
          # Only the exact version for a pre-release; :X.Y and :latest only move forward.
          tags="$IMAGE:$VERSION"
          case "$VERSION" in
            *-*) ;;
            *)
              newest=$(curl -s -A "degibbs-container-build" https://crates.io/api/v1/crates/degibbs | jq -r .crate.max_stable_version)
              newest_minor=$(curl -s -A "degibbs-container-build" https://crates.io/api/v1/crates/degibbs | jq -r '[.versions[].num | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))] | map(select(startswith("'"${VERSION%.*}"'.")))  | sort_by(split(".") | map(tonumber)) | last')
              [ "$VERSION" = "$newest_minor" ] && tags="$tags,$IMAGE:${VERSION%.*}"
              [ "$VERSION" = "$newest" ] && tags="$tags,$IMAGE:latest"
              ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VERSION=${{ steps.v.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the pushed image
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          docker run --rm "$IMAGE:$VERSION" --version | grep -F "$VERSION"
          docker run --rm --entrypoint pigz "$IMAGE:$VERSION" --version

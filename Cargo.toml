[package]
name = "degibbs"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
description = "Gibbs-ringing removal for MRI NIfTI images by local subvoxel shifts, with partial Fourier support"
repository = "https://github.com/srikash/degibbs.rs"
readme = "README.md"
license-file = "LICENCE"
keywords = ["mri", "nifti", "gibbs-ringing", "neuroimaging", "denoising"]
categories = ["science", "command-line-utilities"]
include = ["src/", "tests/", "Cargo.toml", "Cargo.lock", "README.md", "LICENCE", "CHANGELOG.md", "CITATION.bib", "CITATION.cff", "docs/install.md", "docs/usage.md", "docs/development.md", "docs/containers.md", "docs/validation.md", "docs/qc_images.png", "docs/qc_profiles.png"]

[dependencies]
anyhow = "1.0.104"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
clap = { version = "4.6.7", features = ["derive"] }
ndarray = "0.17.2"
nifti = { version = "0.18.0", features = ["ndarray_volumes"] }
rayon = "1.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
approx = "0.5.1"
assert_cmd = "2.2.2"
tempfile = "3.27.0"

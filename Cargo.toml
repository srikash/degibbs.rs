[package]
name = "degibbs"
version = "0.1.6"
edition = "2024"
license-file = "LICENCE"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ndarray = "0.17.2"
nifti = { version = "0.18.0", features = ["ndarray_volumes"] }
rayon = "1.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
approx = "0.5.1"
assert_cmd = "2.2.2"
tempfile = "3.27.0"
